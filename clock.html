<!DOCTYPE html>
<html lang="en" >
<head>
  <meta charset="UTF-8">
</head>
<body>
    <h1>live clock</h1>
    <div>
    <button onclick="generatetime();"> launch </button>
        <br>
        <br>
        <center>
        <div id="display"></div>
        </center>
    </div>
  
</body>
   
</html>
<script>
function generatetime()
{
    var date = new Date();
    var hour = date.getHours(); 
    var minute = date.getMinutes(); 
    var seconds = date.getSeconds(); 

    var day = "AM";
    
    if(hour == 0)
    {
        hour = 12;
    }
    
    if(hour >= 12)
    {
        hour = hour - 12;
        day = "PM";
    }
    
    hour = (hour < 10) ? "0" + hour : hour;
    minute = (minute < 10) ? "0" + minute : minute;
    seconds = (seconds < 10) ? "0" + seconds : seconds;
    
    var time = hour + ":" + minute + ":" + seconds + " " + day;
    document.getElementById("display").innerHTML = time;
    
    setInterval(generatetime, 2000);
}
</script>

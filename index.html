<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Clock</title>

        <!--Style Part-->
        <style>
            *{
                margin: 0;
                padding: 0;
                box-sizing: border-box;
                font-family: Arial, Helvetica, sans-serif;
            }

            /*Body CSS*/
            body{
                height: 100vh;
                display: flex;
                justify-content: center;
                align-items: center;
                flex-direction: column;
                background: linear-gradient(135deg,#141e30,#243b55);
            }

            /*Heading CSS*/
            h1{
                color: white;
                margin-bottom: 30px;
                font-size: 40px;
                letter-spacing: 10px;
                text-shadow: 0 0 15px cyan;
            }

            .clock{
                width: 350px;
                height: 350px;
                border-radius: 50%;
                background: linear-gradient(145deg,#2c3e50,#1a252f);
                border: 8px solid #00e5ff;
                display: flex;
                justify-content: center;
                align-items: center;
                box-shadow: 0 0 20px cyan,
                            inset 0 0 20px rgba(255,255,255,0.2);
                position: relative;
            }

            .clock-box1{
                width: 250px;
                height: 250px;
                border-radius: 50%;
                background: #0f172a;
                display: flex;
                justify-content: center;
                align-items: center;
                box-shadow: 0 0 15px cyan,
                            inset 0 0 20px rgba(0,255,255,0.4);
            }

            .clock:hover{
                transform: scale(1.03);
            }

            button{
                padding: 15px 35px;
                font-size: 20px;
                font-weight: bold;
                border: none;
                border-radius: 30px;
                background: linear-gradient(45deg, #00c6ff,#0072ff);
                color: white;
                cursor: pointer;
                transition: 0.3s;
                box-shadow: 0 0 15px #00c6ff;
            }

            button:hover{
                transform: scale(1.08);
                background: linear-gradient(45deg,#00e5ff,#0066ff);
                box-shadow: 0 0 25px cyan;
            }

        </style>
    </head>

    <!--Body Part-->
    <body>
        <h1>Live Clock</h1>

        <div class="clock">
    
            <div class="clock-box1">
                <button onclick="openClock()">Launch</button>
            </div>
        
        </div>

    </body>

    <!--Script Part-->
        <script>
            <!--Calling openClock-->
            function openClock(){
                window.open("clock.html","_blank");
            }
        </script>
</html>
